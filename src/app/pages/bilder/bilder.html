<main class="py-20">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-extrabold text-charcoal-blue mb-8">Bilder</h1>

    @if (loading()) {
      <div
        class="bg-white border border-charcoal-blue-100 rounded-2xl shadow-sm p-6 md:p-10"
      >
        <p class="text-xl text-charcoal-blue leading-relaxed">Bilder werden geladen …</p>
      </div>
    } @else if (error()) {
      <div
        class="bg-white border border-charcoal-blue-100 rounded-2xl shadow-sm p-6 md:p-10"
      >
        <p class="text-xl text-charcoal-blue leading-relaxed">{{ error() }}</p>
      </div>
    } @else if (images().length === 0) {
      <div
        class="bg-white border border-charcoal-blue-100 rounded-2xl shadow-sm p-6 md:p-10"
      >
        <p class="text-xl md:text-2xl text-charcoal-blue leading-relaxed">
          Vielen Dank fürs Mitmachen! Die Bilder folgen in Kürze.
        </p>
      </div>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 not-prose">
        @for (image of images(); track image.url) {
          <figure
            class="overflow-hidden rounded-xl border border-charcoal-blue-100 bg-white shadow-sm"
          >
            <img
              [src]="image.url"
              [alt]="imageAlt(image)"
              class="w-full h-64 object-cover"
              loading="lazy"
            />
            <figcaption class="px-4 py-3 text-sm text-charcoal-blue-400 text-center">
              @if (image.authorOrganization) {
                <span class="block font-semibold text-charcoal-blue">{{
                  image.authorOrganization
                }}</span>
              }
              <span [class.font-semibold]="!image.authorOrganization" [class.text-charcoal-blue]="!image.authorOrganization">{{
                image.authorName
              }}</span>
            </figcaption>
          </figure>
        }
      </div>
    }
  </div>
</main>
