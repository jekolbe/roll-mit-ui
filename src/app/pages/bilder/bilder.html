<main class="py-20">
  <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-extrabold text-charcoal-blue mb-8">Bilder</h1>

    @if (loading()) {
      <div
        class="bg-white border border-charcoal-blue-100 rounded-2xl shadow-sm p-6 md:p-10 flex flex-col items-center gap-4"
      >
        <div
          class="h-8 w-8 rounded-full border-2 border-charcoal-blue-100 border-t-blaze-orange animate-spin"
          aria-hidden="true"
        ></div>
        <p class="text-xl text-charcoal-blue leading-relaxed">Bilder werden geladen …</p>
      </div>
    } @else if (error()) {
      <div
        class="bg-white border border-charcoal-blue-100 rounded-2xl shadow-sm p-6 md:p-10"
      >
        <p class="text-xl text-charcoal-blue leading-relaxed">{{ error() }}</p>
      </div>
    } @else if (images().length === 0) {
      <div
        class="bg-white border border-charcoal-blue-100 rounded-2xl shadow-sm p-6 md:p-10"
      >
        <p class="text-xl md:text-2xl text-charcoal-blue leading-relaxed">
          Vielen Dank fürs Mitmachen! Die Bilder folgen in Kürze.
        </p>
      </div>
    } @else {
      <div class="columns-1 sm:columns-2 xl:columns-3 gap-4 not-prose">
        @for (image of visibleImages(); track image.url) {
          <figure class="break-inside-avoid mb-4">
            <div
              class="overflow-hidden rounded-xl border border-charcoal-blue-100 shadow-sm bg-charcoal-blue-100/25"
              [style.aspect-ratio]="imageAspectRatio(image) ?? null"
              [class.min-h-48]="!hasDimensions(image)"
            >
              <img
                bilderImageReveal
                [src]="image.url"
                [attr.width]="image.width"
                [attr.height]="image.height"
                [alt]="imageAlt(image)"
                class="bilder-image block h-full w-full object-contain opacity-0 scale-[1.03]"
                [class.bilder-image--visible]="isImageLoaded(image.url)"
                loading="lazy"
                decoding="async"
                (revealed)="markImageLoaded(image.url)"
              />
            </div>
            <figcaption class="mt-1 px-1 text-[10px] leading-tight text-charcoal-blue-400">
              {{ imageCaption(image) }}
            </figcaption>
          </figure>
        }
      </div>

      @if (hasMore()) {
        <div
          #loadMoreSentinel
          class="mt-6 flex min-h-16 items-center justify-center py-4"
          aria-live="polite"
        >
          @if (loadingMore()) {
            <div
              class="h-6 w-6 rounded-full border-2 border-charcoal-blue-100 border-t-blaze-orange animate-spin"
              aria-label="Weitere Bilder werden geladen"
            ></div>
          }
        </div>
      }
    }
  </div>
</main>
